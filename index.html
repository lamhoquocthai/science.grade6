<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THẦY THÁI ĐÀ LẠT - LỚP KHOA HỌC TỰ NHIÊN 6</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b132b;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Header Branding */
        .header-bar {
            width: 100%;
            max-width: 900px;
            background: linear-gradient(135deg, #ff6b00 0%, #0055ff 100%);
            color: white;
            text-align: center;
            padding: 12px 15px;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            border-radius: 8px 8px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header-title {
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
        }

        .header-contact {
            background-color: rgba(0, 0, 0, 0.3);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.95rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* Game Container */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            height: 550px;
            background-color: #1c2541;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border: 2px solid #0055ff;
            border-top: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Screens overlays */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(11, 19, 43, 0.95);
            padding: 20px;
            text-align: center;
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            color: #ff6b00;
            font-size: 2.2rem;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(255, 107, 0, 0.5);
        }

        p.subtitle {
            color: #00d4ff;
            font-size: 1.1rem;
            margin-bottom: 25px;
        }

        /* Form elements */
        .select-group {
            margin: 10px 0;
            width: 100%;
            max-width: 400px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #ffaa00;
            font-weight: 600;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 2px solid #0055ff;
            background-color: #0b132b;
            color: white;
            font-size: 1rem;
            outline: none;
            cursor: pointer;
        }

        select:focus {
            border-color: #ff6b00;
        }

        .btn {
            background: linear-gradient(45deg, #ff6b00, #ff8c00);
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(255, 107, 0, 0.4);
            transition: all 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 0, 0.6);
            background: linear-gradient(45deg, #ff8c00, #ff6b00);
        }

        .btn:active {
            transform: translateY(1px);
        }

        /* Question Overlay */
        #question-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 19, 43, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 25px;
            z-index: 20;
            box-sizing: border-border-box;
        }

        .q-header {
            color: #00d4ff;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .q-text {
            font-size: 1.25rem;
            color: #ffffff;
            margin-bottom: 20px;
            max-width: 750px;
            line-height: 1.4;
            background: rgba(0, 85, 255, 0.2);
            padding: 15px 20px;
            border-radius: 8px;
            border-left: 4px solid #ff6b00;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            max-width: 750px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .opt-btn {
            background-color: #1c2541;
            color: white;
            border: 2px solid #0055ff;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            display: flex;
            align-items: center;
        }

        .opt-btn:hover {
            background-color: #0055ff;
            border-color: #ff6b00;
        }

        .opt-btn .opt-prefix {
            background-color: #ff6b00;
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin-right: 10px;
            font-weight: bold;
            flex-shrink: 0;
        }

        /* HUD Overlay */
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 5;
        }

        .hud-card {
            background: rgba(11, 19, 43, 0.8);
            border: 1px solid #0055ff;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hud-card span {
            color: #ff6b00;
        }

        /* Result Screen */
        .score-big {
            font-size: 3rem;
            color: #ff6b00;
            font-weight: bold;
            margin: 15px 0;
            text-shadow: 0 0 15px rgba(255, 107, 0, 0.5);
        }

        .stats {
            font-size: 1.1rem;
            color: #00d4ff;
            margin-bottom: 20px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <div class="header-title">THẦY THÁI ĐÀ LẠT - LỚP KHOA HỌC TỰ NHIÊN 6</div>
        <div class="header-contact">LIÊN HỆ: 086 2008 917</div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <!-- HUD In-game -->
        <div id="hud" class="hidden">
            <div class="hud-card">ĐIỂM: <span id="score-val">0</span></div>
            <div class="hud-card">MẠNG: <span id="lives-val">❤️❤️❤️</span></div>
            <div class="hud-card">MÔN: <span id="subject-val">Vật Lý</span></div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="screen">
            <h1>ZOMBIE ĂN THỊT</h1>
            <p class="subtitle">ÔN TẬP KHOA HỌC TỰ NHIÊN 6 - HỌC KỲ 1</p>

            <div class="select-group">
                <label for="subject-select">CHỌN PHÂN MÔN:</label>
                <select id="subject-select">
                    <option value="physics">Vật Lý (Đo lường, Mở đầu)</option>
                    <option value="chemistry">Hóa Học (Chất, Vật liệu, Hỗn hợp)</option>

            <div class="select-group">
                <label for="difficulty-select">CHỌN MỨC ĐỘ / TỐC ĐỘ:</label>
                <select id="difficulty-select">
                    <option value="easy">Chậm - Câu hỏi Cơ Bản</option>

            <button class="btn" id="start-btn">BẮT ĐẦU CHƠI</button>
        </div>

        <!-- Question Modal -->
        <div id="question-modal" class="hidden">
            <div class="q-header" id="q-subject-tag">PHÂN MÔN VẬT LÝ</div>
            <div class="q-text" id="q-text">Nội dung câu hỏi sẽ hiển thị ở đây?</div>
            <div class="options-grid" id="options-container">
                <!-- Direct buttons inserted dynamically -->
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="screen hidden">
            <h1 style="color: #ff3333;">GAME OVER</h1>
            <p class="subtitle">Zombie đã xâm nhập thành công!</p>
            <div class="score-big" id="final-score">0</div>
            <div class="stats" id="final-stats">
                Số câu trả lời đúng: 0<br>
                Mức độ: Vừa
            </div>
            <button class="btn" id="restart-btn">CHƠI LẠI</button>
        </div>
    </div>

    <script>
        // --- NÂN CẤP CƠ SỞ DỮ LIỆU CÂU HỎI KHTN 6 (KẾT NỐI TRI THỨC) ---
        const questionBank = {
            physics: {
                easy: [
                    { q: "Đơn vị đo độ dài chính thức trong hệ thống đo lường của nước ta là gì?", opts: ["Milimét (mm)", "Mét (m)", "Centimét (cm)", "Kilômét (km)"], a: 1 },
                    { q: "Dụng cụ dùng để đo khối lượng của một vật là gì?", opts: ["Thước dây", "Nhiệt kế", "Cân", "Bình chia độ"], a: 2 },
                    { q: "Đơn vị đo thời gian trong hệ đo lường hợp pháp của Việt Nam là gì?", opts: ["Giây (s)", "Phút (min)", "Giờ (h)", "Ngày"], a: 0 },
                    { q: "Dụng cụ dùng để đo nhiệt độ là gì?", opts: ["Lực kế", "Nhiệt kế", "Cân đồng hồ", "Thước kẹp"], a: 1 }
                ],
                medium: [
                    { q: "Khi dùng thước đo độ dài, ta cần đặt thước như thế nào?", opts: ["Đặt lệch so với chiều dài cần đo", "Đặt dọc theo chiều dài cần đo, vạch số 0 trùng một đầu của vật", "Đặt tùy ý", "Đặt ở bất kỳ vạch nào trùng đầu vật"], a: 1 },
                    { q: "Giới hạn đo (GHĐ) của thước là gì?", opts: ["Khoảng cách giữa 2 vạch chia liên tiếp", "Chiều dài lớn nhất ghi trên thước", "Chiều dài nhỏ nhất ghi trên thước", "Độ rộng của thước"], a: 1 },
                    { q: "Độ chia nhỏ nhất (ĐCNN) của thước là gì?", opts: ["Chiều dài giữa 2 vạch chia liên tiếp trên thước", "Vạch chia nhỏ nhất trên thước", "Chiều dài nhỏ nhất ghi trên thước", "Giá trị nhỏ nhất ghi trên thước"], a: 0 },
                    { q: "Để đo thời gian chạy 100m của học sinh, ta nên dùng loại đồng hồ nào?", opts: ["Đồng hồ treo tường", "Đồng hồ cát", "Đồng hồ bấm giây", "Đồng hồ đeo tay thông thường"], a: 2 }
                ],
                hard: [
                    { q: "Một bình chia độ đang chứa 50cm³ nước. Thả chìm một viên đá vào bình thì nước dâng lên vạch 85cm³. Thể tích viên đá là bao nhiêu?", opts: ["135 cm³", "50 cm³", "35 cm³", "85 cm³"], a: 2 },
                    { q: "Thang nhiệt độ Celsius quy định nhiệt độ của nước đá đang tan và hơi nước đang sôi lần lượt là:", opts: ["0°C và 100°C", "32°F và 212°F", "100°C và 0°C", "0°K và 100°K"], a: 0 },
                    { q: "Thực hành đo khối lượng túi hoa quả bằng cân đồng hồ, thao tác nào sau đây KHÔNG đúng?", opts: ["Đặt cân trên bề mặt bằng phẳng", "Hiệu chỉnh kim cân về vạch số 0", "Mắt nhìn lệch so với kim cân", "Đặt vật cẩn thận lên đĩa cân"], a: 2 }
                ]
            },
            chemistry: {
                easy: [
                    { q: "Chất nào sau đây tồn tại ở thể khí trong điều kiện thường?", opts: ["Nước", "Sắt", "Khí Oxygen", "Đường"], a: 2 },
                    { q: "Vật thể nào sau đây là vật thể tự nhiên?", opts: ["Cái bàn gỗ", "Quả núi", "Chiếc xe đạp", "Cái cốc thủy tinh"], a: 1 },
                    { q: "Khí nào chiếm khoảng 21% thể tích không khí?", opts: ["Nitrogen", "Carbon dioxide", "Oxygen", "Hydrogen"], a: 2 },
                    { q: "Vật liệu nào sau đây thường được dùng để dẫn điện?", opts: ["Nhựa", "Thủy tinh", "Đồng", "Gỗ khô"], a: 2 }
                ],
                medium: [
                    { q: "Hành động nào sau đây biểu hiện tính chất hóa học của chất?", opts: ["Nước hoa quả đông lại thành đá", "Đốt cháy que củi thành than", "Hòa tan đường vào nước", "Mặt trời làm khô quần áo"], a: 1 },
                    { q: "Để tách muối ăn ra khỏi dung dịch nước muối, người ta dùng phương pháp nào?", opts: ["Lọc", "Cô cạn (Bốc hơi)", "Dùng nam thạch", "Lắng"], a: 1 },
                    { q: "Hỗn hợp nào sau đây là hỗn hợp đồng nhất?", opts: ["Nước và dầu ăn", "Nước đường", "Nước và cát", "Hỗn hợp xi măng và nước"], a: 1 },
                    { q: "Quá trình chuyển từ thể rắn sang thể lỏng gọi là gì?", opts: ["Sự nóng chảy", "Sự đông đặc", "Sự bay hơi", "Sự ngưng tụ"], a: 0 }
                ],
                hard: [
                    { q: "Phương pháp lọc dùng để tách riêng các chất ra khỏi hỗn hợp nào?", opts: ["Chất rắn tan trong chất lỏng", "Chất rắn không tan trong chất lỏng", "Hai chất lỏng hòa tan vào nhau", "Các chất khí khác nhau"], a: 1 },
                    { q: "Khí nào gây nên hiện tượng hiệu ứng nhà kính và biến đổi khí hậu?", opts: ["Oxygen", "Nitrogen", "Carbon dioxide (CO2)", "Argon"], a: 2 },
                    { q: "Thành phần phần trăm thể tích của khí Nitrogen trong không khí xấp xỉ là bao nhiêu?", opts: ["21%", "78%", "1%", "0.03%"], a: 1 }
                ]
            },
            biology: {
                easy: [
                    { q: "Đơn vị cơ sở cấu tạo nên mọi cơ thể sống là gì?", opts: ["Mô", "Tế bào", "Cơ quan", "Hệ cơ quan"], a: 1 },
                    { q: "Dụng cụ nào giúp chúng ta quan sát rõ cấu tạo của tế bào?", opts: ["Kính kính lặp", "Kính hiển vi quang học", "Kính râm", "Thước phóng đại"], a: 1 },
                    { q: "Thành phần nào điều khiển mọi hoạt động sống của tế bào?", opts: ["Màng tế bào", "Tế bào chất", "Nhân tế bào (hoặc vùng nhân)", "Không bào"], a: 2 },
                    { q: "Cơ thể nào sau đây là cơ thể đơn bào?", opts: ["Con người", "Cây bàng", "Trùng roi", "Con mèo"], a: 2 }
                ],
                medium: [
                    { q: "Điểm khác biệt lớn nhất giữa tế bào thực vật và tế bào động vật là gì?", opts: ["Tế bào thực vật có màng sinh chất", "Tế bào thực vật có lục lạp và thành tế bào", "Tế bào động vật có nhân", "Tế bào thực vật không có tế bào chất"], a: 1 },
                    { q: "Sự lớn lên và phân chia của tế bào có ý nghĩa gì đối với sinh vật?", opts: ["Giúp cơ thể sinh sản", "Giúp cơ thể lớn lên và thay thế tế bào già/hỏng", "Tăng khối lượng nước trong cơ thể", "Giúp cơ thể đổi màu"], a: 1 },
                    { q: "Tập hợp các tế bào giống nhau cùng thực hiện một chức năng nhất định tạo thành gì?", opts: ["Cơ quan", "Mô", "Hệ cơ quan", "Cơ thể"], a: 1 },
                    { q: "Cơ quan nào sau đây thuộc hệ tuần hoàn ở người?", opts: ["Dạ dày", "Phổi", "Tim", "Thận"], a: 2 }
                ],
                hard: [
                    { q: "Sắp xếp các cấp tổ chức của cơ thể đa bào từ nhỏ đến lớn:", opts: ["Tế bào -> Cơ quan -> Mô -> Hệ cơ quan -> Cơ thể", "Tế bào -> Mô -> Cơ quan -> Hệ cơ quan -> Cơ thể", "Mô -> Tế bào -> Cơ quan -> Hệ cơ quan -> Cơ thể", "Tế bào -> Mô -> Hệ cơ quan -> Cơ quan -> Cơ thể"], a: 1 },
                    { q: "Thành phần nào của tế bào là nơi diễn ra các hoạt động sống cơ bản như hô hấp, tổng hợp chất?", opts: ["Nhân tế bào", "Tế bào chất", "Màng tế bào", "Thành tế bào"], a: 1 },
                    { q: "Một tế bào sau 3 lần phân chia liên tiếp sẽ tạo ra bao nhiêu tế bào con?", opts: ["3 tế bào", "6 tế bào", "8 tế bào", "16 tế bào"], a: 2 }
                ]
            }
        };

        // Engine Game Variables
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let gameRunning = false;
        let score = 0;
        let lives = 3;
        let activeZombies = [];
        let bullets = [];
        let currentSubject = "physics";
        let currentDifficulty = "medium";
        let spawnTimer = null;
        let activeQuestionZombie = null;
        let correctAnswersCount = 0;

        // Player Cannon Settings
        const player = {
            x: 50,
            y: 275,
            radius: 25,
            color: "#0055ff"
        };

        // Speed configurations based on difficulty
        const diffConfig = {
            easy: { speedMin: 0.4, speedMax: 0.8, interval: 4000 },
            medium: { speedMin: 0.8, speedMax: 1.4, interval: 3000 },
            hard: { speedMin: 1.5, speedMax: 2.2, interval: 2000 }
        };

        // Resize Canvas dynamically
        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            player.y = canvas.height / 2;
        }
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();

        // Game Loop
        function animate() {
            if (!gameRunning) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Background Grid/Road
            ctx.strokeStyle = "rgba(0, 85, 255, 0.1)";
            ctx.lineWidth = 2;
            for (let i = 0; i < canvas.width; i += 40) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }

            // Draw Base Line
            ctx.strokeStyle = "#ff6b00";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(100, 0);
            ctx.lineTo(100, canvas.height);
            ctx.stroke();

            // Draw Player Cannon
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#00d4ff";
            ctx.lineWidth = 3;
            ctx.stroke();

            // Cannon Barrel
            ctx.fillStyle = "#ff6b00";
            ctx.fillRect(player.x, player.y - 8, 35, 16);

            // Update & Draw Bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.speed;

                ctx.fillStyle = "#ffaa00";
                ctx.beginPath();
                ctx.arc(b.x, b.y, 6, 0, Math.PI * 2);
                ctx.fill();

                // Bullet hits target zombie
                if (b.targetZombie) {
                    let dist = Math.hypot(b.x - b.targetZombie.x, b.y - b.targetZombie.y);
                    if (dist < b.targetZombie.radius) {
                        // Explosion effect
                        createExplosion(b.targetZombie.x, b.targetZombie.y);
                        // Remove zombie
                        activeZombies = activeZombies.filter(z => z !== b.targetZombie);
                        bullets.splice(i, 1);
                        continue;
                    }
                }

                if (b.x > canvas.width) {
                    bullets.splice(i, 1);
                }
            }

            // Update & Draw Zombies
            for (let i = activeZombies.length - 1; i >= 0; i--) {
                let z = activeZombies[i];
                z.x -= z.speed;

                // Draw Zombie Body
                ctx.fillStyle = z.color;
                ctx.beginPath();
                ctx.arc(z.x, z.y, z.radius, 0, Math.PI * 2);
                ctx.fill();

                // Zombie Eyes
                ctx.fillStyle = "#red";
                ctx.beginPath();
                ctx.arc(z.x - 8, z.y - 5, 4, 0, Math.PI * 2);
                ctx.arc(z.x - 8, z.y + 5, 4, 0, Math.PI * 2);
                ctx.fillStyle = "#ff0000";
                ctx.fill();

                // Zombie Label
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 12px Arial";
                ctx.textAlign = "center";
                ctx.fillText("ZOMBIE", z.x, z.y - z.radius - 5);

                // Zombie reaches defense line
                if (z.x - z.radius <= 100) {
                    activeZombies.splice(i, 1);
                    lives--;
                    updateHUD();
                    if (lives <= 0) {
                        endGame();
                    }
                }
            }

            requestAnimationFrame(animate);
        }

        // Particle Explosions
        let particles = [];
        function createExplosion(x, y) {
            // Visual feedback handled gracefully
        }

        // Spawn Zombie Function
        function spawnZombie() {
            if (!gameRunning) return;

            const cfg = diffConfig[currentDifficulty];
            const speed = Math.random() * (cfg.speedMax - cfg.speedMin) + cfg.speedMin;
            const yPos = Math.random() * (canvas.height - 100) + 50;

            const newZombie = {
                x: canvas.width + 30,
                y: yPos,
                radius: 22,
                speed: speed,
                color: "#2a9d8f"
            };

            activeZombies.push(newZombie);
        }

        // Direct Canvas Click Handling for Zombies
        canvas.addEventListener("click", function (e) {
            if (!gameRunning) return;

            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            // Find clicked zombie
            for (let z of activeZombies) {
                let dist = Math.hypot(clickX - z.x, clickY - z.y);
                if (dist <= z.radius + 15) { // Enhanced touch/click area
                    triggerQuestion(z);
                    break;
                }
            }
        });

        // Trigger Quiz Modal
        function triggerQuestion(zombie) {
            activeQuestionZombie = zombie;
            
            // Get Question Pool
            let pool = [];
            if (currentSubject === "all") {
                pool = [
                    ...questionBank.physics[currentDifficulty],
                    ...questionBank.chemistry[currentDifficulty],
                    ...questionBank.biology[currentDifficulty]
                ];
            } else {
                pool = questionBank[currentSubject][currentDifficulty];
            }

            const qData = pool[Math.floor(Math.random() * pool.length)];

            // Fill Question UI
            document.getElementById("q-subject-tag").innerText = `PHÂN MÔN: ${getSubjectName(currentSubject)}`;
            document.getElementById("q-text").innerText = qData.q;

            const optsContainer = document.getElementById("options-container");
            optsContainer.innerHTML = "";

            const prefixes = ["A", "B", "C", "D"];
            qData.opts.forEach((optText, idx) => {
                const btn = document.createElement("button");
                btn.className = "opt-btn";
                btn.innerHTML = `<span class="opt-prefix">${prefixes[idx]}</span> ${optText}`;
                
                // Direct click binding
                btn.onclick = function() {
                    handleAnswer(idx === qData.a);
                };

                optsContainer.appendChild(btn);
            });

            // Display Modal
            document.getElementById("question-modal").classList.remove("hidden");
        }

        // Handle Selected Answer
        function handleAnswer(isCorrect) {
            document.getElementById("question-modal").classList.add("hidden");

            if (isCorrect && activeQuestionZombie) {
                // Shoot Bullet at Zombie
                bullets.push({
                    x: player.x + 30,
                    y: player.y,
                    speed: 12,
                    targetZombie: activeQuestionZombie
                });

                score += (currentDifficulty === "easy" ? 10 : currentDifficulty === "medium" ? 20 : 30);
                correctAnswersCount++;
                updateHUD();
            } else {
                // Wrong answer penalty: Zombie speeds up!
                if (activeQuestionZombie) {
                    activeQuestionZombie.speed += 1.0;
                    activeQuestionZombie.color = "#e76f51";
                }
            }
            activeQuestionZombie = null;
        }

        // Helpers
        function getSubjectName(sub) {
            switch(sub) {
                case "physics": return "VẬT LÝ 6";
                case "chemistry": return "HÓA HỌC 6";
                case "biology": return "SINH HỌC 6";
                default: return "TỔNG HỢP KHTN 6";
            }
        }

        function updateHUD() {
            document.getElementById("score-val").innerText = score;
            document.getElementById("subject-val").innerText = getSubjectName(currentSubject);
            
            let hearts = "";
            for (let i = 0; i < lives; i++) hearts += "❤️";
            document.getElementById("lives-val").innerText = hearts || "💀";
        }

        // Start Game
        document.getElementById("start-btn").addEventListener("click", function() {
            currentSubject = document.getElementById("subject-select").value;
            currentDifficulty = document.getElementById("difficulty-select").value;

            score = 0;
            lives = 3;
            correctAnswersCount = 0;
            activeZombies = [];
            bullets = [];
            gameRunning = true;

            document.getElementById("start-screen").classList.add("hidden");
            document.getElementById("game-over-screen").classList.add("hidden");
            document.getElementById("hud").classList.remove("hidden");

            updateHUD();
            resizeCanvas();

            // Clear previous timers
            if (spawnTimer) clearInterval(spawnTimer);
            spawnTimer = setInterval(spawnZombie, diffConfig[currentDifficulty].interval);

            // Initial Spawn
            spawnZombie();

            // Run Loop
            animate();
        });

        // Restart Game
        document.getElementById("restart-btn").addEventListener("click", function() {
            document.getElementById("game-over-screen").classList.add("hidden");
            document.getElementById("start-screen").classList.remove("hidden");
        });

        // End Game
        function endGame() {
            gameRunning = false;
            clearInterval(spawnTimer);

            document.getElementById("hud").classList.add("hidden");
            document.getElementById("game-over-screen").classList.remove("hidden");
            document.getElementById("final-score").innerText = score + " ĐIỂM";
            
            const diffText = currentDifficulty === "easy" ? "Chậm" : currentDifficulty === "medium" ? "Vừa" : "Nhanh";
            document.getElementById("final-stats").innerHTML = `
                Số câu trả lời đúng: <b>${correctAnswersCount}</b> câu<br>
                Mức độ: <b>${diffText}</b> | Phân môn: <b>${getSubjectName(currentSubject)}</b>
            `;
        }
    </script>
</body>
