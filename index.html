<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THẦY THÁI ĐÀ LẠT - LỚP KHOA HỌC TỰ NHIÊN 7</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b132b;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Header Branding */
        .header-bar {
            width: 100%;
            max-width: 900px;
            background: linear-gradient(135deg, #ff6b00 0%, #0055ff 100%);
            color: white;
            text-align: center;
            padding: 12px 15px;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            border-radius: 8px 8px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header-title {
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
        }

        .header-contact {
            background-color: rgba(0, 0, 0, 0.3);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.95rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* Game Container */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            height: 550px;
            background-color: #1c2541;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border: 2px solid #0055ff;
            border-top: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Screens overlays */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(11, 19, 43, 0.95);
            padding: 20px;
            text-align: center;
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            color: #ff6b00;
            font-size: 2.2rem;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(255, 107, 0, 0.5);
        }

        p.subtitle {
            color: #00d4ff;
            font-size: 1.1rem;
            margin-bottom: 25px;
        }

        /* Form elements */
        .select-group {
            margin: 10px 0;
            width: 100%;
            max-width: 400px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #ffaa00;
            font-weight: 600;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 2px solid #0055ff;
            background-color: #0b132b;
            color: white;
            font-size: 1rem;
            outline: none;
            cursor: pointer;
        }

        select:focus {
            border-color: #ff6b00;
        }

        .btn {
            background: linear-gradient(45deg, #ff6b00, #ff8c00);
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(255, 107, 0, 0.4);
            transition: all 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 0, 0.6);
            background: linear-gradient(45deg, #ff8c00, #ff6b00);
        }

        .btn:active {
            transform: translateY(1px);
        }

        /* Question Overlay */
        #question-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 19, 43, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 25px;
            z-index: 20;
            box-sizing: border-box;
        }

        .q-header {
            color: #00d4ff;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .q-text {
            font-size: 1.2rem;
            color: #ffffff;
            margin-bottom: 20px;
            max-width: 750px;
            line-height: 1.4;
            background: rgba(0, 85, 255, 0.2);
            padding: 15px 20px;
            border-radius: 8px;
            border-left: 4px solid #ff6b00;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            max-width: 750px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .opt-btn {
            background-color: #1c2541;
            color: white;
            border: 2px solid #0055ff;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            display: flex;
            align-items: center;
        }

        .opt-btn:hover {
            background-color: #0055ff;
            border-color: #ff6b00;
        }

        .opt-btn .opt-prefix {
            background-color: #ff6b00;
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin-right: 10px;
            font-weight: bold;
            flex-shrink: 0;
        }

        /* HUD Overlay */
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 5;
        }

        .hud-card {
            background: rgba(11, 19, 43, 0.8);
            border: 1px solid #0055ff;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hud-card span {
            color: #ff6b00;
        }

        /* Result Screen */
        .score-big {
            font-size: 3rem;
            color: #ff6b00;
            font-weight: bold;
            margin: 15px 0;
            text-shadow: 0 0 15px rgba(255, 107, 0, 0.5);
        }

        .stats {
            font-size: 1.1rem;
            color: #00d4ff;
            margin-bottom: 20px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <div class="header-title">THẦY THÁI ĐÀ LẠT - LỚP KHOA HỌC TỰ NHIÊN 7</div>
        <div class="header-contact">LIÊN HỆ: 086 2008 917</div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <!-- HUD In-game -->
        <div id="hud" class="hidden">
            <div class="hud-card">ĐIỂM: <span id="score-val">0</span></div>
            <div class="hud-card">MẠNG: <span id="lives-val">❤️❤️❤️</span></div>
            <div class="hud-card">MÔN: <span id="subject-val">Hóa Học</span></div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="screen">
            <h1>ZOMBIE ĂN THỊT</h1>
            <p class="subtitle">ÔN TẬP KHOA HỌC TỰ NHIÊN 7 - HỌC KỲ 1</p>

            <div class="select-group">
                <label for="subject-select">CHỌN PHÂN MÔN / CHỦ ĐỀ:</label>
                <select id="subject-select">
                    <option value="chemistry">Hóa Học (Nguyên tử, Bảng tuần hoàn, Liên kết)</option>
                    <option value="physics">Vật Lý (Tốc độ & Âm thanh)</option>
                    <option value="biology">Sinh Học (Trao đổi chất & Chuyển hóa năng lượng)</option>
                    <option value="all">Tổng Hợp (Tất cả chủ đề KHTN 7)</option>
                </select>
            </div>

            <div class="select-group">
                <label for="difficulty-select">CHỌN MỨC ĐỘ / TỐC ĐỘ:</label>
                <select id="difficulty-select">
                    <option value="easy">Chậm - Câu hỏi Cơ Bản</option>
                    <option value="medium" selected>Vừa - Câu hỏi Trung Bình</option>
                    <option value="hard">Nhanh - Câu hỏi Thử Thách</option>
                </select>
            </div>

            <button class="btn" id="start-btn">BẮT ĐẦU CHƠI</button>
        </div>

        <!-- Question Modal -->
        <div id="question-modal" class="hidden">
            <div class="q-header" id="q-subject-tag">PHÂN MÔN HÓA HỌC</div>
            <div class="q-text" id="q-text">Nội dung câu hỏi sẽ hiển thị ở đây?</div>
            <div class="options-grid" id="options-container">
                <!-- Direct buttons inserted dynamically -->
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="screen hidden">
            <h1 style="color: #ff3333;">GAME OVER</h1>
            <p class="subtitle">Zombie đã xâm nhập thành công!</p>
            <div class="score-big" id="final-score">0</div>
            <div class="stats" id="final-stats">
                Số câu trả lời đúng: 0<br>
                Mức độ: Vừa
            </div>
            <button class="btn" id="restart-btn">CHƠI LẠI</button>
        </div>
    </div>

    <script>
        // --- NGÂN HÀNG CÂU HỎI KHTN 7 (KẾT NỐI TRI THỨC - HK1) ---
        const questionBank = {
            chemistry: {
                easy: [
                    { q: "Nguyên tử được cấu tạo từ những hạt nào?", opts: ["Proton và electron", "Proton và neutron", "Proton, neutron và electron", "Chỉ có hạt electron"], a: 2 },
                    { q: "Hạt mang điện tích dương nằm trong hạt nhân nguyên tử là hạt nào?", opts: ["Electron", "Neutron", "Proton", "Phân tử"], a: 2 },
                    { q: "Hạt không mang điện nằm trong hạt nhân nguyên tử là hạt nào?", opts: ["Proton", "Neutron", "Electron", "Ion"], a: 1 },
                    { q: "Các nguyên tố hóa học trong bảng tuần hoàn được sắp xếp theo chiều tăng dần của yếu tố nào?", opts: ["Khối lượng nguyên tử", "Điện tích hạt nhân", "Số lượng neutron", "Bán kính nguyên tử"], a: 1 }
                ],
                medium: [
                    { q: "Bảng tuần hoàn các nguyên tố hóa học gồm có bao nhiêu chu kì?", opts: ["5 chu kì", "6 chu kì", "7 chu kì", "8 chu kì"], a: 2 },
                    { q: "Trong nguyên tử hòa điện về điện, số hạt proton luôn bằng số hạt nào?", opts: ["Hạt neutron", "Hạt electron", "Tổng số hạt nhân", "Khối lượng nguyên tử"], a: 1 },
                    { q: "Các nguyên tố trong cùng một nhóm A trong bảng tuần hoàn có đặc điểm nào giống nhau?", opts: ["Số lớp electron", "Số electron ở lớp ngoài cùng", "Số proton", "Khối lượng nguyên tử"], a: 1 },
                    { q: "Hạt đại diện cho chất, gồm một số nguyên tử liên kết với nhau và thể hiện đầy đủ tính chất hóa học của chất là gì?", opts: ["Nguyên tử", "Phân tử", "Hạt nhân", "Proton"], a: 1 }
                ],
                hard: [
                    { q: "Khi các nguyên tử kim loại liên kết với các nguyên tử phi kim, loại liên kết nào thường được hình thành?", opts: ["Liên kết cộng hóa trị", "Liên kết ion", "Liên kết kim loại", "Liên kết phi kim"], a: 1 },
                    { q: "Liên kết cộng hóa trị là liên kết được hình thành do yếu tố nào giữa các nguyên tử?", opts: ["Sự cho và nhận electron", "Sự dùng chung một hay nhiều cặp electron", "Lực hút tĩnh điện giữa các ion", "Sự trao đổi các hạt neutron"], a: 1 },
                    { q: "Một nguyên tử có 8 proton trong hạt nhân. Số electron ở lớp ngoài cùng của nguyên tử này là bao nhiêu?", opts: ["2 electron", "6 electron", "8 electron", "4 electron"], a: 1 }
                ]
            },
            physics: {
                easy: [
                    { q: "Công thức tính tốc độ chuyển động là gì (v: tốc độ, s: quãng đường, t: thời gian)?", opts: ["v = s . t", "v = s / t", "v = t / s", "v = s + t"], a: 1 },
                    { q: "Đơn vị đo tốc độ thường dùng trong hệ đo lường hợp pháp là gì?", opts: ["m/s và km/h", "m/phút và cm/s", "km/s và m/h", "mm/s và km/phút"], a: 0 },
                    { q: "Âm thanh được tạo ra từ đâu?", opts: ["Từ các vật đứng yên", "Từ các vật đang dao động", "Từ các vật bị nung nóng", "Từ các vật chiếu sáng"], a: 1 },
                    { q: "Số dao động trong một giây gọi là gì?", opts: ["Độ to của âm", "Tần số dao động", "Biên độ dao động", "Tốc độ truyền âm"], a: 1 }
                ],
                medium: [
                    { q: "Đơn vị đo tần số dao động là gì?", opts: ["Đềxiben (dB)", "Mát trên giây (m/s)", "Héc (Hz)", "Giây (s)"], a: 2 },
                    { q: "Âm truyền nhanh nhất trong môi trường nào sau đây?", opts: ["Môi trường chất khí", "Môi trường chất lỏng", "Môi trường chất rắn", "Môi trường chân không"], a: 2 },
                    { q: "Âm thanh KHÔNG thể truyền qua môi trường nào?", opts: ["Nước biển", "Thanh thép", "Không khí", "Chân không"], a: 3 },
                    { q: "Một ô đi được quãng đường 60 km trong thời gian 1.5 giờ. Tốc độ của ô tô là bao nhiêu?", opts: ["40 km/h", "90 km/h", "45 km/h", "50 km/h"], a: 0 }
                ],
                hard: [
                    { q: "Độ to của âm phụ thuộc vào yếu tố nào của dao động?", opts: ["Tần số dao động", "Biên độ dao động", "Thời gian dao động", "Môi trường truyền âm"], a: 1 },
                    { q: "Âm có tần số lớn hơn 20 000 Hz được gọi là gì?", opts: ["Hạ âm", "Âm nghe được", "Siêu âm", "Tiếng ồn"], a: 2 },
                    { q: "Một người nhìn thấy tia sét trước khi nghe thấy tiếng sấm 3 giây. Biết tốc độ truyền âm trong không khí là 340 m/s. Khoảng cách từ người đó đến nơi có sét là:", opts: ["1020 m", "680 m", "113 m", "340 m"], a: 0 }
                ]
            },
            biology: {
                easy: [
                    { q: "Tập hợp các quá trình thu nhận, biến đổi và sử dụng các chất từ môi trường gọi là gì?", opts: ["Trao đổi chất", "Chuyển hóa năng lượng", "Cảm ứng", "Sinh trưởng"], a: 0 },
                    { q: "Quá trình quang hợp ở thực vật diễn ra chủ yếu ở cơ quan nào?", opts: ["Rễ cây", "Thân cây", "Lá cây", "Hoa"], a: 2 },
                    { q: "Sản phẩm của quá trình quang hợp ở thực vật gồm những gì?", opts: ["Nước và Carbon dioxide", "Glucose (Chất hữu cơ) và Oxygen", "Glucose và Carbon dioxide", "Oxygen và Nước"], a: 1 },
                    { q: "Quá trình hô hấp tế bào có vai trò chính là gì?", opts: ["Tạo ra chất dinh dưỡng", "Giải phóng năng lượng (ATP) cho hoạt động sống", "Tổng hợp khí Oxygen", "Hấp thụ ánh sáng mặt trời"], a: 1 }
                ],
                medium: [
                    { q: "Bào quan nào là nơi diễn ra quá trình quang hợp ở tế bào thực vật?", opts: ["Ty thể", "Lục lạp", "Nhân tế bào", "Không bào"], a: 1 },
                    { q: "Bào quan nào đóng vai trò là 'nhà máy năng lượng' diễn ra hô hấp tế bào?", opts: ["Ty thể", "Lục lạp", "Màng sinh chất", "Lưới nội chất"], a: 0 },
                    { q: "Yếu tố nào sau đây KHÔNG phải là nguyên liệu của quá trình quang hợp?", opts: ["Nước", "Khí Carbon dioxide", "Ánh sáng mặt trời", "Khí Oxygen"], a: 3 },
                    { q: "Khí nào được hấp thụ trong quá trình hô hấp tế bào ở sinh vật?", opts: ["Carbon dioxide", "Oxygen", "Nitrogen", "Hydrogen"], a: 1 }
                ],
                hard: [
                    { q: "Quang hợp và hô hấp tế bào có mối quan hệ với nhau như thế nào?", opts: ["Độc lập và không liên quan", "Ngược chiều nhưng phụ thuộc lẫn nhau", "Giống hệt nhau về nguyên liệu và sản phẩm", "Chỉ xảy ra đồng thời vào ban đêm"], a: 1 },
                    { q: "Nước và muối khoáng từ đất được vận chuyển lên lá cây nhờ mô nào?", opts: ["Mô rây", "Mô gỗ", "Mô biểu bì", "Mô cơ"], a: 1 },
                    { q: "Các chất hữu cơ tổng hợp từ lá được vận chuyển đến các bộ phận khác của cây nhờ cấu trúc nào?", opts: ["Mạch gỗ", "Mạch rây", "Lông hút", "Khí khổng"], a: 1 }
                ]
            }
        };

        // Engine Game Variables
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let gameRunning = false;
        let score = 0;
        let lives = 3;
        let activeZombies = [];
        let bullets = [];
        let explosions = [];
        let currentSubject = "chemistry";
        let currentDifficulty = "medium";
        let spawnTimer = null;
        let activeQuestionZombie = null;
        let correctAnswersCount = 0;

        // Player Cannon Settings
        const player = {
            x: 50,
            y: 275,
            radius: 25,
            color: "#0055ff"
        };

        // Speed configurations based on difficulty
        const diffConfig = {
            easy: { speedMin: 0.4, speedMax: 0.8, interval: 4000 },
            medium: { speedMin: 0.8, speedMax: 1.4, interval: 3000 },
            hard: { speedMin: 1.5, speedMax: 2.2, interval: 2000 }
        };

        // Resize Canvas dynamically
        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            player.y = canvas.height / 2;
        }
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();

        // Game Loop
        function animate() {
            if (!gameRunning) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Background Grid/Road
            ctx.strokeStyle = "rgba(0, 85, 255, 0.1)";
            ctx.lineWidth = 2;
            for (let i = 0; i < canvas.width; i += 40) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }

            // Draw Base Line
            ctx.strokeStyle = "#ff6b00";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(100, 0);
            ctx.lineTo(100, canvas.height);
            ctx.stroke();

            // Draw Player Cannon
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#00d4ff";
            ctx.lineWidth = 3;
            ctx.stroke();

            // Cannon Barrel
            ctx.fillStyle = "#ff6b00";
            ctx.fillRect(player.x, player.y - 8, 35, 16);

            // Update & Draw Bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                
                // Di chuyển đạn về phía mục tiêu
                let dx = b.targetX - b.x;
                let dy = b.targetY - b.y;
                let dist = Math.hypot(dx, dy);

                if (dist < 15) {
                    // Đạn trúng zombie -> Xóa zombie và đạn
                    createExplosion(b.targetX, b.targetY);
                    activeZombies = activeZombies.filter(z => z.id !== b.zombieId);
                    bullets.splice(i, 1);
                    continue;
                }

                b.x += (dx / dist) * b.speed;
                b.y += (dy / dist) * b.speed;

                ctx.fillStyle = "#ffaa00";
                ctx.beginPath();
                ctx.arc(b.x, b.y, 7, 0, Math.PI * 2);
                ctx.fill();
            }

            // Update & Draw Explosions
            for (let i = explosions.length - 1; i >= 0; i--) {
                let ex = explosions[i];
                ex.radius += 2;
                ex.alpha -= 0.05;

                if (ex.alpha <= 0) {
                    explosions.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.globalAlpha = ex.alpha;
                ctx.fillStyle = "#ff6b00";
                ctx.beginPath();
                ctx.arc(ex.x, ex.y, ex.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // Update & Draw Zombies
            for (let i = activeZombies.length - 1; i >= 0; i--) {
                let z = activeZombies[i];
                z.x -= z.speed;

                // Draw Zombie Body
                ctx.fillStyle = z.color;
                ctx.beginPath();
                ctx.arc(z.x, z.y, z.radius, 0, Math.PI * 2);
                ctx.fill();

                // Zombie Eyes
                ctx.fillStyle = "#ff0000";
                ctx.beginPath();
                ctx.arc(z.x - 8, z.y - 5, 4, 0, Math.PI * 2);
                ctx.arc(z.x - 8, z.y + 5, 4, 0, Math.PI * 2);
                ctx.fill();

                // Zombie Label
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 12px Arial";
                ctx.textAlign = "center";
                ctx.fillText("ZOMBIE", z.x, z.y - z.radius - 5);

                // Zombie reaches defense line
                if (z.x - z.radius <= 100) {
                    activeZombies.splice(i, 1);
                    lives--;
                    updateHUD();
                    if (lives <= 0) {
                        endGame();
                    }
                }
            }

            requestAnimationFrame(animate);
        }

        function createExplosion(x, y) {
            explosions.push({ x: x, y: y, radius: 10, alpha: 1.0 });
        }

        // Spawn Zombie Function
        let zombieIdCounter = 0;
        function spawnZombie() {
            if (!gameRunning) return;

            const cfg = diffConfig[currentDifficulty];
            const speed = Math.random() * (cfg.speedMax - cfg.speedMin) + cfg.speedMin;
            const yPos = Math.random() * (canvas.height - 100) + 50;

            const newZombie = {
                id: zombieIdCounter++,
                x: canvas.width + 30,
                y: yPos,
                radius: 22,
                speed: speed,
                color: "#2a9d8f"
            };

            activeZombies.push(newZombie);
        }

        // Direct Canvas Click Handling for Zombies
        canvas.addEventListener("click", function (e) {
            if (!gameRunning) return;

            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            // Find clicked zombie
            for (let z of activeZombies) {
                let dist = Math.hypot(clickX - z.x, clickY - z.y);
                if (dist <= z.radius + 15) {
                    triggerQuestion(z);
                    break;
                }
            }
        });

        // Trigger Quiz Modal
        function triggerQuestion(zombie) {
            activeQuestionZombie = zombie;
            
            // Get Question Pool
            let pool = [];
            if (currentSubject === "all") {
                pool = [
                    ...questionBank.chemistry[currentDifficulty],
                    ...questionBank.physics[currentDifficulty],
                    ...questionBank.biology[currentDifficulty]
                ];
            } else {
                pool = questionBank[currentSubject][currentDifficulty];
            }

            const qData = pool[Math.floor(Math.random() * pool.length)];

            // Fill Question UI
            document.getElementById("q-subject-tag").innerText = `PHÂN MÔN: ${getSubjectName(currentSubject)}`;
            document.getElementById("q-text").innerText = qData.q;

            const optsContainer = document.getElementById("options-container");
            optsContainer.innerHTML = "";

            const prefixes = ["A", "B", "C", "D"];
            qData.opts.forEach((optText, idx) => {
                const btn = document.createElement("button");
                btn.className = "opt-btn";
                btn.innerHTML = `<span class="opt-prefix">${prefixes[idx]}</span> ${optText}`;
                
                btn.onclick = function() {
                    handleAnswer(idx === qData.a);
                };

                optsContainer.appendChild(btn);
            });

            // Display Modal
            document.getElementById("question-modal").classList.remove("hidden");
        }

        // Handle Selected Answer
        function handleAnswer(isCorrect) {
            document.getElementById("question-modal").classList.add("hidden");

            if (isCorrect && activeQuestionZombie) {
                // Tạo viên đạn bắn chính xác vị trí zombie hiện tại
                bullets.push({
                    x: player.x + 35,
                    y: player.y,
                    targetX: activeQuestionZombie.x,
                    targetY: activeQuestionZombie.y,
                    zombieId: activeQuestionZombie.id,
                    speed: 20
                });

                score += (currentDifficulty === "easy" ? 10 : currentDifficulty === "medium" ? 20 : 30);
                correctAnswersCount++;
                updateHUD();
            } else {
                // Trả lời sai: Zombie tăng tốc
                if (activeQuestionZombie) {
                    activeQuestionZombie.speed += 1.0;
                    activeQuestionZombie.color = "#e76f51";
                }
            }
            activeQuestionZombie = null;
        }

        // Helpers
        function getSubjectName(sub) {
            switch(sub) {
                case "chemistry": return "HÓA HỌC 7";
                case "physics": return "VẬT LÝ 7";
                case "biology": return "SINH HỌC 7";
                default: return "TỔNG HỢP KHTN 7";
            }
        }

        function updateHUD() {
            document.getElementById("score-val").innerText = score;
            document.getElementById("subject-val").innerText = getSubjectName(currentSubject);
            
            let hearts = "";
            for (let i = 0; i < lives; i++) hearts += "❤️";
            document.getElementById("lives-val").innerText = hearts || "💀";
        }

        // Start Game
        document.getElementById("start-btn").addEventListener("click", function() {
            currentSubject = document.getElementById("subject-select").value;
            currentDifficulty = document.getElementById("difficulty-select").value;

            score = 0;
            lives = 3;
            correctAnswersCount = 0;
            activeZombies = [];
            bullets = [];
            explosions = [];
            gameRunning = true;

            document.getElementById("start-screen").classList.add("hidden");
            document.getElementById("game-over-screen").classList.add("hidden");
            document.getElementById("hud").classList.remove("hidden");

            updateHUD();
            resizeCanvas();

            // Clear previous timers
            if (spawnTimer) clearInterval(spawnTimer);
            spawnTimer = setInterval(spawnZombie, diffConfig[currentDifficulty].interval);

            // Initial Spawn
            spawnZombie();

            // Run Loop
            animate();
        });

        // Restart Game
        document.getElementById("restart-btn").addEventListener("click", function() {
            document.getElementById("game-over-screen").classList.add("hidden");
            document.getElementById("start-screen").classList.remove("hidden");
        });

        // End Game
        function endGame() {
            gameRunning = false;
            clearInterval(spawnTimer);

            document.getElementById("hud").classList.add("hidden");
            document.getElementById("game-over-screen").classList.remove("hidden");
            document.getElementById("final-score").innerText = score + " ĐIỂM";
            
            const diffText = currentDifficulty === "easy" ? "Chậm" : currentDifficulty === "medium" ? "Vừa" : "Nhanh";
            document.getElementById("final-stats").innerHTML = `
                Số câu trả lời đúng: <b>${correctAnswersCount}</b> câu<br>
                Mức độ: <b>${diffText}</b> | Phân môn: <b>${getSubjectName(currentSubject)}</b>
            `;
        }
    </script>
</body>
</html>
